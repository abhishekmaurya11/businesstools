let sortMode = "default";

/* ============== Helpers ============== */
const $ = (s)=>document.querySelector(s);
const el = (tag, cls, html)=>{ const e = document.createElement(tag); if(cls) e.className = cls; if(html!=null) e.innerHTML = html; return e; };

function initials(name){ if (!name) return "?"; return name.replace(/[^A-Za-z0-9 ]/g,"").split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase(); }
function priceClass(p){ return p === "free" ? "free" : (p === "paid" ? "paid" : "freemium"); }
function priceLabel(p){ if (!p) return "Unknown"; return p.charAt(0).toUpperCase() + p.slice(1); }

/* ============== Render: Grid (Multi-Filter Logic) ============== */
function renderGrid(){
  const grid = $("#grid");
  grid.innerHTML = "";

  // 1. Filter by Category
  let list = TOOLS.filter(t => activeCategory === "all" || t.cat === activeCategory);

  // 2. Filter by Price
  if (activePrice !== "all") {
    list = list.filter(t => t.price === activePrice);
  }

  // 3. Filter by Search Query
  const q = query.trim().toLowerCase();
  if (q) {
    list = list.filter(t =>
      t.name.toLowerCase().includes(q) ||
      t.desc.toLowerCase().includes(q) ||
      (t.tags || []).some(tag => tag.toLowerCase().includes(q))
    );
  }

  // 4. Sort
  if (sortMode === "rating") { list.sort((a,b) => b.rating - a.rating); }
  else if (sortMode === "name") { list.sort((a,b) => a.name.localeCompare(b.name)); }

  // 5. Update result count
  const total = TOOLS.length;
  $("#resultCount").textContent = (q || activeCategory !== 'all' || activePrice !== 'all')
    ? `${list.length} of ${total} tools found`
    : `${total} free tools`;

  // 6. Empty state
  if (list.length === 0) {
    grid.appendChild(el("div","empty",
      '<div class="big">🔍</div>'+
      '<div style="font-weight:600;color:var(--text);margin-bottom:4px">No tools found</div>'+
      '<div>Try a different keyword or adjust your filters.</div>'));
    return;
  }

  // 7. Render cards
  list.forEach(t => {
    const color = ICON_COLORS[t.cat] || ICON_COLORS.other;
    const card = el("div","card");
    card.innerHTML = `
      <div class="card-head">
        <div class="icon" style="background:linear-gradient(135deg, ${color}, ${color}cc)">${initials(t.name)}</div>
        <div>
          <div class="card-title">${t.name}${t.featured ? ' <span style="font-size:10px;color:#0b0d12;background:'+color+';padding:2px 6px;border-radius:4px;vertical-align:middle;margin-left:6px;font-weight:700">Featured</span>' : ''}</div>
          <div class="card-cat">${CATEGORIES.find(c=>c.id===t.cat)?.label || t.cat}</div>
        </div>
      </div>
      <div class="card-desc">${t.desc}</div>
      <div class="card-tags">
        <span class="tag ${priceClass(t.price)}">${priceLabel(t.price)}</span>
        ${(t.tags||[]).slice(0,4).map(tag=>`<span class="tag">${tag}</span>`).join("")}
      </div>
      <div class="card-foot">
        <div class="rate"><span class="star">★</span> ${t.rating.toFixed(1)}</div>
        <a class="visit" href="${t.url}" target="_blank" rel="noopener noreferrer">Visit <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M7 17 17 7M9 7h8v8"/></svg></a>
      </div>
    `;
    grid.appendChild(card);
  });
}

/* ============== Events (Multi-Filter Wiring) ============== */
$("#search").addEventListener("input", (e)=>{ query = e.target.value; renderGrid(); });
$("#sort").addEventListener("change", (e)=>{ sortMode = e.target.value; renderGrid(); });

// Category Chips
document.querySelector('.filter-group').addEventListener('click', (e) => {
  if (e.target.classList.contains('chip') && e.target.dataset.cat) {
    document.querySelectorAll('.filter-group .chip').forEach(c => c.classList.remove('active'));
    e.target.classList.add('active');
    activeCategory = e.target.dataset.cat;
    renderGrid();
  }
});

// Price Chips
document.querySelectorAll('[data-price]').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('[data-price]').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    activePrice = chip.dataset.price;
    renderGrid();
  });
});

/* ============== Init (Dynamic Chip Generation) ============== */
(function init() {
  // Populate Category Chips
  const catGroup = document.querySelector('.filter-group');
  CATEGORIES.forEach(cat => {
    const chip = el('button', `chip${cat.id === 'all' ? ' active' : ''}`, cat.label);
    chip.dataset.cat = cat.id;
    catGroup.appendChild(chip);
  });

  // Initial render
  renderGrid();
})();
</script>
</body>
</html>
