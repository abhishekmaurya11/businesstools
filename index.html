<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Best Places to Sell · Gemini AI</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --radius: 14px;
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 64px;
    }
    .app { width: 100%; max-width: 960px; }
    header { text-align: center; margin-bottom: 28px; }
    header h1 {
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }
    header h1 span { color: var(--accent); }
    header p {
      color: var(--muted);
      font-size: 0.95rem;
      max-width: 600px;
      margin: 0 auto;
    }
    .input-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px;
      margin-bottom: 24px;
    }
    .input-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .input-row input {
      flex: 1 1 240px;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      background: #fff;
    }
    .input-row input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }
    .input-row button {
      padding: 14px 28px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }
    .input-row button:hover:not(:disabled) { background: var(--accent-hover); }
    .input-row button:active:not(:disabled) { transform: scale(0.98); }
    .input-row button:disabled { opacity: 0.6; cursor: not-allowed; }
    .spinner {
      width: 18px;
      height: 18px;
      border: 2.5px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status {
      margin-top: 12px;
      font-size: 0.88rem;
      min-height: 1.3em;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status.error { color: var(--danger); }
    .status.success { color: var(--success); }
    .status.loading { color: var(--muted); }
    .results { display: flex; flex-direction: column; gap: 16px; }
    .result-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px 22px;
      animation: fadeIn 0.35s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .platform-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .platform-header h3 { font-size: 1.15rem; font-weight: 700; }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }
    .badge.excellent { background: #d1fae5; color: #065f46; }
    .badge.good { background: #dbeafe; color: #1e40af; }
    .badge.fair { background: #fef3c7; color: #92400e; }
    .badge.poor { background: #fee2e2; color: #991b1b; }
    .reason {
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.55;
      margin-bottom: 14px;
    }
    .meta-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
      font-size: 0.85rem;
    }
    .meta-item {
      background: #f1f5f9;
      border-radius: 8px;
      padding: 8px 12px;
    }
    .meta-item .label {
      color: var(--muted);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 2px;
    }
    .meta-item .value { font-weight: 600; color: var(--text); }
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }
    .empty-state .icon { font-size: 3rem; margin-bottom: 12px; opacity: 0.5; }
    .empty-state p { font-size: 0.95rem; }
    .error-panel {
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: var(--radius);
      padding: 20px;
      color: #991b1b;
    }
    .error-panel h4 { margin-bottom: 6px; font-size: 0.95rem; }
    .error-panel p { font-size: 0.88rem; line-height: 1.5; margin-bottom: 10px; }
    .error-panel details { margin-top: 10px; }
    .error-panel summary {
      cursor: pointer;
      font-size: 0.82rem;
      color: #7f1d1d;
      font-weight: 600;
      user-select: none;
    }
    .error-panel pre {
      margin-top: 8px;
      background: #1e293b;
      color: #e2e8f0;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.75rem;
      line-height: 1.45;
      overflow-x: auto;
      max-height: 260px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .skeleton {
      background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 8px;
    }
    @keyframes shimmer { to { background-position: -200% 0; } }
    .skeleton-card { height: 160px; border-radius: var(--radius); }
    footer {
      margin-top: 40px;
      text-align: center;
      font-size: 0.78rem;
      color: var(--muted);
      line-height: 1.6;
    }
    @media (max-width: 480px) {
      .input-row button { width: 100%; justify-content: center; }
      .result-card { padding: 16px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Where to sell <span>it</span>?</h1>
      <p>Enter a product name and Gemini will recommend the best marketplaces and channels to sell it.</p>
    </header>

    <div class="input-card">
      <div class="input-row">
        <input
          type="text"
          id="productInput"
          placeholder="e.g. Handmade soy candles, Vintage leather jacket, Mechanical keyboard…"
          autocomplete="off"
          maxlength="200"
        />
        <button id="analyzeBtn">
          <span id="btnIcon">✨</span>
          <span id="btnText">Analyze</span>
        </button>
      </div>
      <div class="status" id="status"></div>
    </div>

    <div class="results" id="results">
      <div class="empty-state">
        <div class="icon">🛍️</div>
        <p>Enter a product above to see where it sells best.</p>
      </div>
    </div>

    <footer>
      Powered by Gemini API · Results are AI-generated recommendations, not financial advice.
    </footer>
  </div>

  <script>
    // =========================================================================
    // CONFIG
    // =========================================================================
    const API_KEY = 'AQ.Ab8RN6J23FGLsX4ccq2I4tjK20dOPUkNWz7Ii5lp12i1VFZeug';
    const MODELS = ['gemini-2.5-flash', 'gemini-2.0-flash', 'gemini-1.5-flash'];

    const RESPONSE_SCHEMA = {
      type: 'object',
      properties: {
        recommendations: {
          type: 'array',
          items: {
            type: 'object',
            properties: {
              platform:   { type: 'string' },
              matchScore: { type: 'string', enum: ['Excellent', 'Good', 'Fair', 'Poor'] },
              reason:     { type: 'string' },
              audience:   { type: 'string' },
              fees:       { type: 'string' },
              bestFor:    { type: 'string' },
              tip:        { type: 'string' }
            },
            required: ['platform', 'matchScore', 'reason', 'audience', 'fees', 'bestFor', 'tip']
          }
        }
      },
      required: ['recommendations']
    };

    // =========================================================================
    // DOM
    // =========================================================================
    const inputEl    = document.getElementById('productInput');
    const analyzeBtn = document.getElementById('analyzeBtn');
    const btnText    = document.getElementById('btnText');
    const btnIcon    = document.getElementById('btnIcon');
    const statusEl   = document.getElementById('status');
    const resultsEl  = document.getElementById('results');

    // =========================================================================
    // PROMPT
    // =========================================================================
    function buildPrompt(productName) {
      return `You are an expert e-commerce strategy consultant. A user wants to know the BEST places to sell the following product:

"${productName}"

Recommend 5–7 selling platforms / channels. For EACH one, return:
- platform (name)
- matchScore: exactly one of "Excellent", "Good", "Fair", "Poor"
- reason (1–2 sentences why it fits or doesn't fit this product)
- audience (who shops there)
- fees (typical fee structure, e.g. "10–15% commission", "No listing fee", "Subscription + fees")
- bestFor (short phrase, e.g. "Handmade & unique items")
- tip (one actionable tip for selling this product there)

Return ONLY the JSON object with a "recommendations" array. No markdown, no code fences, no commentary.`;
    }

    // =========================================================================
    // JSON EXTRACTION (robust)
    // =========================================================================
    function parseJsonResponse(text) {
      let s = String(text || '').trim();
      if (!s) throw new Error('Empty response text');

      // Strip markdown code fences if present
      s = s.replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/i, '').trim();

      // 1. Try direct parse
      let parsed;
      try {
        parsed = JSON.parse(s);
      } catch (_) { /* fall through */ }

      // 2. Try object slice { ... }
      if (parsed === undefined) {
        const start = s.indexOf('{');
        const end = s.lastIndexOf('}');
        if (start !== -1 && end > start) {
          try { parsed = JSON.parse(s.slice(start, end + 1)); } catch (_) {}
        }
      }

      // 3. Try array slice [ ... ]
      if (parsed === undefined) {
        const aStart = s.indexOf('[');
        const aEnd = s.lastIndexOf(']');
        if (aStart !== -1 && aEnd > aStart) {
          try { parsed = { recommendations: JSON.parse(s.slice(aStart, aEnd + 1)) }; } catch (_) {}
        }
      }

      if (parsed === undefined) {
        throw new Error('Could not extract JSON from model output');
      }

      if (Array.isArray(parsed)) parsed = { recommendations: parsed };

      if (!parsed || !Array.isArray(parsed.recommendations)) {
        throw new Error('JSON is missing "recommendations" array');
      }

      // Normalize
      parsed.recommendations = parsed.recommendations
        .filter(r => r && typeof r === 'object')
        .map(r => ({
          platform:   String(r.platform   || 'Unknown'),
          matchScore: String(r.matchScore || 'Fair'),
          reason:     String(r.reason     || ''),
          audience:   String(r.audience   || ''),
          fees:       String(r.fees       || ''),
          bestFor:    String(r.bestFor    || ''),
          tip:        String(r.tip        || '')
        }));

      return parsed;
    }

    // =========================================================================
    // SINGLE API CALL
    // =========================================================================
    async function callGeminiOnce(productName, model, useSchema) {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`;

      const genConfig = {
        temperature: 0.7,
        maxOutputTokens: 4096,
        responseMimeType: 'application/json'
      };
      if (useSchema) genConfig.responseSchema = RESPONSE_SCHEMA;

      const body = {
        contents: [{ role: 'user', parts: [{ text: buildPrompt(productName) }] }],
        generationConfig: genConfig
      };

      const res = await fetch(url, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-goog-api-key': API_KEY
        },
        body: JSON.stringify(body)
      });

      const rawText = await res.text();

      if (!res.ok) {
        let msg = `HTTP ${res.status}`;
        try {
          const errJson = JSON.parse(rawText);
          if (errJson?.error?.message) msg += `: ${errJson.error.message}`;
        } catch (_) {
          if (rawText) msg += `: ${rawText.slice(0, 200)}`;
        }
        const err = new Error(msg);
        err.raw = rawText;
        throw err;
      }

      let data;
      try { data = JSON.parse(rawText); } catch (_) {
        const err = new Error('API returned non-JSON envelope');
        err.raw = rawText;
        throw err;
      }

      const candidate = data?.candidates?.[0];
      const finishReason = candidate?.finishReason || 'unknown';

      const parts = candidate?.content?.parts || [];
      const text = parts.map(p => p.text || '').join('').trim();

      if (!text) {
        const blockReason = data?.promptFeedback?.blockReason;
        const err = new Error(
          blockReason
            ? `Prompt blocked: ${blockReason}`
            : `Empty response from model (finishReason: ${finishReason})`
        );
        err.raw = rawText;
        throw err;
      }

      return { text, finishReason, raw: rawText };
    }

    // =========================================================================
    // MAIN CALL (with multi-model + multi-config fallback)
    // =========================================================================
    let lastDebugRaw = '';

    async function callGemini(productName) {
      const attempts = [];
      let lastRaw = '';

      for (const model of MODELS) {
        for (const useSchema of [true, false]) {
          const label = `${model} / schema:${useSchema}`;
          try {
            const { text, finishReason, raw } = await callGeminiOnce(productName, model, useSchema);
            lastRaw = raw;
            const parsed = parseJsonResponse(text);
            console.log(`[OK] ${label} · finishReason=${finishReason}`);
            return parsed.recommendations;
          } catch (e) {
            lastRaw = e.raw || lastRaw;
            attempts.push(`${label} → ${e.message}`);
            console.warn(`[FAIL] ${label} → ${e.message}`);
          }
        }
      }

      lastDebugRaw = lastRaw;
      const err = new Error('All Gemini attempts failed.');
      err.details = attempts;
      throw err;
    }

    // =========================================================================
    // UI HELPERS
    // =========================================================================
    function setStatus(message, type = '') {
      statusEl.textContent = message;
      statusEl.className = 'status' + (type ? ' ' + type : '');
    }

    function setLoading(isLoading) {
      analyzeBtn.disabled = isLoading;
      inputEl.disabled = isLoading;

      if (isLoading) {
        btnIcon.style.display = 'none';
        btnText.textContent = 'Analyzing…';
        if (!analyzeBtn.querySelector('.spinner')) {
          const spinner = document.createElement('span');
          spinner.className = 'spinner';
          analyzeBtn.prepend(spinner);
        }
      } else {
        const spinner = analyzeBtn.querySelector('.spinner');
        if (spinner) spinner.remove();
        btnIcon.style.display = '';
        btnText.textContent = 'Analyze';
      }
    }

    function scoreBadgeClass(score) {
      switch (String(score).toLowerCase()) {
        case 'excellent': return 'excellent';
        case 'good':      return 'good';
        case 'fair':      return 'fair';
        default:          return 'poor';
      }
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function renderSkeletons() {
      resultsEl.innerHTML = '';
      for (let i = 0; i < 3; i++) {
        const sk = document.createElement('div');
        sk.className = 'skeleton skeleton-card';
        resultsEl.appendChild(sk);
      }
    }

    function renderResults(recommendations) {
      resultsEl.innerHTML = '';

      if (!recommendations.length) {
        resultsEl.innerHTML = `
          <div class="empty-state">
            <div class="icon">🤔</div>
            <p>No recommendations returned. Try a different product name.</p>
          </div>`;
        return;
      }

      recommendations.forEach((rec, idx) => {
        const card = document.createElement('div');
        card.className = 'result-card';
        card.style.animationDelay = `${idx * 0.05}s`;
        const badgeClass = scoreBadgeClass(rec.matchScore);

        card.innerHTML = `
          <div class="platform-header">
            <h3>${escapeHtml(rec.platform)}</h3>
            <span class="badge ${badgeClass}">${escapeHtml(rec.matchScore)}</span>
          </div>
          <p class="reason">${escapeHtml(rec.reason)}</p>
          <div class="meta-grid">
            <div class="meta-item">
              <div class="label">Audience</div>
              <div class="value">${escapeHtml(rec.audience || '—')}</div>
            </div>
            <div class="meta-item">
              <div class="label">Fees</div>
              <div class="value">${escapeHtml(rec.fees || '—')}</div>
            </div>
            <div class="meta-item">
              <div class="label">Best For</div>
              <div class="value">${escapeHtml(rec.bestFor || '—')}</div>
            </div>
            <div class="meta-item">
              <div class="label">💡 Tip</div>
              <div class="value">${escapeHtml(rec.tip || '—')}</div>
            </div>
          </div>
        `;
        resultsEl.appendChild(card);
      });
    }

    function renderError(message, details, raw) {
      resultsEl.innerHTML = '';
      const panel = document.createElement('div');
      panel.className = 'error-panel';

      const detailsHtml = details && details.length
        ? `<details><summary>Attempt log (${details.length} tries)</summary><pre>${escapeHtml(details.join('\n'))}</pre></details>`
        : '';

      const rawHtml = raw
        ? `<details><summary>Show raw API response</summary><pre>${escapeHtml(raw.slice(0, 5000))}</pre></details>`
        : '';

      panel.innerHTML = `
        <h4>⚠️ Couldn't get a valid response</h4>
        <p>${escapeHtml(message)}</p>
        ${detailsHtml}
        ${rawHtml}
      `;
      resultsEl.appendChild(panel);
    }

    // =========================================================================
    // MAIN HANDLER
    // =========================================================================
    async function handleAnalyze() {
      const productName = inputEl.value.trim();
      if (!productName) {
        setStatus('Please enter a product name.', 'error');
        inputEl.focus();
        return;
      }

      setLoading(true);
      setStatus('Asking Gemini where this sells best…', 'loading');
      renderSkeletons();

      try {
        const recommendations = await callGemini(productName);
        renderResults(recommendations);
        setStatus(`Found ${recommendations.length} selling channels for “${productName}”.`, 'success');
      } catch (err) {
        console.error('Gemini failed:', err);
        renderError(
          err.message || 'Something went wrong. Please try again.',
          err.details || [],
          lastDebugRaw
        );
        setStatus('Request failed — see details below.', 'error');
      } finally {
        setLoading(false);
      }
    }

    // =========================================================================
    // EVENTS
    // =========================================================================
    analyzeBtn.addEventListener('click', handleAnalyze);
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        handleAnalyze();
      }
    });
    window.addEventListener('load', () => inputEl.focus());
  </script>
</body>
</html>
