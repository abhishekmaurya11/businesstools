<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Free AI Tools Directory — Search 300+ Free AI Tools</title>
<meta name="description" content="Search a curated directory of free and freemium AI tools across writing, image, video, code, audio and more." />
<style>
  /* ============== Design Tokens ============== */
  :root{
    --bg:#0b0d12;
    --bg-2:#11141c;
    --card:#151925;
    --card-2:#1b2130;
    --border:rgba(255,255,255,0.08);
    --border-strong:rgba(255,255,255,0.14);
    --text:#e7eaf0;
    --muted:#9aa3b2;
    --muted-2:#6b7484;
    --accent:#7c5cff;
    --accent-2:#22d3ee;
    --accent-3:#f472b6;
    --green:#34d399;
    --amber:#fbbf24;
    --radius:14px;
    --radius-sm:10px;
    --shadow:0 10px 30px rgba(0,0,0,0.35);
    --maxw:1180px;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(124,92,255,0.18), transparent 60%),
      radial-gradient(900px 500px at 0% 10%, rgba(34,211,238,0.12), transparent 55%),
      var(--bg);
    color:var(--text);
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  a{color:inherit;text-decoration:none}
  img{max-width:100%;display:block}
  .container{width:100%;max-width:var(--maxw);margin:0 auto;padding:0 24px}

  /* ============== Header ============== */
  header.nav{
    position:sticky;top:0;z-index:50;
    backdrop-filter:saturate(140%) blur(12px);
    background:rgba(11,13,18,0.72);
    border-bottom:1px solid var(--border);
  }
  .nav-inner{display:flex;align-items:center;justify-content:space-between;height:64px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-0.02em;font-size:18px}
  .brand .logo{
    width:32px;height:32px;border-radius:9px;
    background:conic-gradient(from 210deg, var(--accent), var(--accent-2), var(--accent-3), var(--accent));
    box-shadow:0 6px 18px rgba(124,92,255,0.35);
    position:relative;
  }
  .brand .logo::after{
    content:"AI";position:absolute;inset:0;display:grid;place-items:center;
    font-size:11px;font-weight:900;color:#0b0d12;letter-spacing:0.5px;
  }
  .nav-links{display:flex;gap:8px;align-items:center}
  .nav-links a{
    color:var(--muted);font-size:14px;font-weight:500;padding:8px 12px;border-radius:8px;transition:.2s;
  }
  .nav-links a:hover{color:var(--text);background:rgba(255,255,255,0.05)}
  .btn-cta{
    background:linear-gradient(135deg,var(--accent),#5b7bff);
    color:#fff;padding:9px 16px;border-radius:10px;font-weight:600;font-size:14px;
    box-shadow:0 8px 22px rgba(124,92,255,0.35);transition:transform .15s ease, box-shadow .2s;
  }
  .btn-cta:hover{transform:translateY(-1px);box-shadow:0 10px 26px rgba(124,92,255,0.5)}
  .menu-btn{display:none;background:none;border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:8px;cursor:pointer}

  /* ============== Hero ============== */
  .hero{padding:72px 0 36px;text-align:center}
  .pill{
    display:inline-flex;align-items:center;gap:8px;
    background:rgba(124,92,255,0.12);border:1px solid rgba(124,92,255,0.3);
    color:#c7b8ff;padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;margin-bottom:22px;
  }
  .pill .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(124,92,255,0.25)}
  .hero h1{
    font-size:clamp(34px,6vw,60px);line-height:1.05;letter-spacing:-0.03em;font-weight:800;
    max-width:920px;margin:0 auto 18px;
  }
  .hero h1 .grad{
    background:linear-gradient(120deg,var(--accent-2),var(--accent),var(--accent-3));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .hero p.sub{color:var(--muted);font-size:clamp(15px,2vw,18px);max-width:620px;margin:0 auto 30px}
  .search-wrap{max-width:640px;margin:0 auto;position:relative}
  .search-wrap svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted-2)}
  #search{
    width:100%;padding:16px 18px 16px 48px;font-size:16px;color:var(--text);
    background:var(--card);border:1px solid var(--border-strong);border-radius:12px;outline:none;transition:.2s;
  }
  #search:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(124,92,255,0.18)}
  #search::placeholder{color:var(--muted-2)}
  .stats{display:flex;gap:32px;justify-content:center;flex-wrap:wrap;margin-top:34px}
  .stat .num{font-size:26px;font-weight:800;letter-spacing:-0.02em}
  .stat .num.grad{background:linear-gradient(120deg,var(--accent-2),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
  .stat .lbl{color:var(--muted);font-size:13px;margin-top:2px}

  /* ============== Filters ============== */
  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:48px 0 22px}
  .filters{display:flex;gap:8px;flex-wrap:wrap}
  .chip{
    padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;
    background:var(--card);border:1px solid var(--border);color:var(--muted);transition:.2s;user-select:none;
  }
  .chip:hover{color:var(--text);border-color:var(--border-strong)}
  .chip.active{
    background:linear-gradient(135deg,rgba(124,92,255,0.25),rgba(34,211,238,0.15));
    border-color:rgba(124,92,255,0.5);color:#fff;
  }
  .sort-wrap{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
  #sort{
    background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:8px;
    padding:8px 10px;font-size:13px;cursor:pointer;outline:none;
  }
  #sort:focus{border-color:var(--accent)}

  /* ============== Grid ============== */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
  .card{
    background:linear-gradient(180deg,var(--card),var(--bg-2));
    border:1px solid var(--border);border-radius:var(--radius);padding:20px;
    position:relative;overflow:hidden;transition:transform .18s ease, border-color .2s, box-shadow .2s;
    display:flex;flex-direction:column;
  }
  .card::before{
    content:"";position:absolute;inset:0;background:radial-gradient(400px 120px at 50% -10%, rgba(124,92,255,0.18), transparent 60%);
    opacity:0;transition:opacity .25s;
  }
  .card:hover{transform:translateY(-4px);border-color:var(--border-strong);box-shadow:var(--shadow)}
  .card:hover::before{opacity:1}
  .card-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .icon{
    width:46px;height:46px;border-radius:12px;flex-shrink:0;display:grid;place-items:center;
    font-weight:800;font-size:18px;color:#0b0d12;letter-spacing:-0.5px;
    box-shadow:0 6px 14px rgba(0,0,0,0.35);
  }
  .card-title{font-size:17px;font-weight:700;letter-spacing:-0.01em}
  .card-cat{font-size:12px;color:var(--muted);margin-top:1px}
  .card-desc{color:var(--muted);font-size:14px;flex:1;margin-bottom:14px}
  .card-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .tag{
    font-size:11px;font-weight:600;padding:4px 8px;border-radius:6px;
    background:rgba(255,255,255,0.05);border:1px solid var(--border);color:var(--muted);
  }
  .tag.free{color:var(--green);border-color:rgba(52,211,153,0.3);background:rgba(52,211,153,0.08)}
  .tag.paid{color:var(--amber);border-color:rgba(251,191,36,0.3);background:rgba(251,191,36,0.08)}
  .tag.freemium{color:var(--accent-2);border-color:rgba(34,211,238,0.3);background:rgba(34,211,238,0.08)}
  .card-foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:12px;border-top:1px solid var(--border)}
  .rate{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--amber);font-weight:600}
  .rate .star{color:var(--amber)}
  .visit{
    display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--accent-2);
    transition:gap .2s;
  }
  .visit:hover{gap:9px}
  .empty{
    grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted);
    border:1px dashed var(--border);border-radius:var(--radius);
  }
  .empty .big{font-size:40px;margin-bottom:10px}

  /* ============== Footer ============== */
  footer{margin-top:72px;border-top:1px solid var(--border);padding:36px 0;color:var(--muted);font-size:14px}
  .foot-inner{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px}
  footer a{color:var(--muted);transition:color .2s}
  footer a:hover{color:var(--text)}
  .foot-links{display:flex;gap:20px;flex-wrap:wrap}

  /* ============== Mobile ============== */
  @media (max-width:760px){
    .nav-links{display:none}
    .menu-btn{display:block}
    .nav-links.open{
      display:flex;flex-direction:column;position:absolute;top:64px;left:0;right:0;
      background:var(--bg-2);border-bottom:1px solid var(--border);padding:12px 24px;gap:6px;
    }
    .nav-links.open a{width:100%}
    .stats{gap:22px}
    .toolbar{flex-direction:column;align-items:flex-start}
  }
</style>
</head>
<body>
<!-- Styling an anchor (link) tag -->
<a href="https://www.javascriptdoctor.blog/2026/11/donate-us-as-no-ads-here.html" style="color: #dc2626; text-decoration: none; background-color: #fee2e2; padding: 4px 8px; border-radius: 4px;">
 Click Here To Donate Us As No Ads Here 
</a>
<section class="hero">
  <div class="container">
    <h1>Search <span class="grad">300+ free AI tools</span></h1>
    <p class="sub">Find free and freemium AI tools for writing, images, video, code, audio, research and productivity.</p>
    <div class="search-wrap">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="search" type="search" aria-label="Search AI tools" placeholder="Search by name, category, tag, or use case…" />
    </div>
    <p id="resultCount" class="sub" aria-live="polite"></p>
  </div>
</section>

<section id="directory" class="container">
  <div class="grid" id="grid"><!-- cards injected by JS --></div>
</section>

<script>
/* ============== Data Source ============== */
// Verified dataset from hlist.cc – includes pricing_tier ("free", "freemium", "paid").
// We filter client-side to keep only free and freemium tools.
const DATA_URL = 'https://hlist.cc/api/v1/tools.json';

/* ============== Fallback (30 free tools) ============== */
// Used only if the remote fetch fails.
const FALLBACK_TOOLS = [
  {name:"ChatGPT", cat:"chat", price:"freemium", rating:4.8, featured:true, desc:"Conversational AI assistant with a free tier.", tags:["GPT-4","assistant"], url:"https://chat.openai.com"},
  {name:"Claude", cat:"chat", price:"freemium", rating:4.7, featured:true, desc:"Anthropic's assistant with a free plan.", tags:["anthropic","reasoning"], url:"https://claude.ai"},
  {name:"Perplexity", cat:"chat", price:"freemium", rating:4.5, featured:true, desc:"Answer engine that cites live web sources (free).", tags:["search","citations"], url:"https://www.perplexity.ai"},
  {name:"Notion AI", cat:"productivity", price:"freemium", rating:4.2, featured:false, desc:"AI inside Notion with a free tier.", tags:["notes","workspace"], url:"https://www.notion.so/product/ai"},
  {name:"HuggingChat", cat:"chat", price:"free", rating:4.0, featured:false, desc:"Open-source chat assistant, completely free.", tags:["open-source","chat"], url:"https://huggingface.co/chat"},
  {name:"Stable Diffusion", cat:"image", price:"free", rating:4.4, featured:false, desc:"Open-weights image model you can run locally.", tags:["open-source","text-to-image"], url:"https://stability.ai"},
  {name:"Whisper", cat:"audio", price:"free", rating:4.8, featured:false, desc:"OpenAI's open-source speech-to-text model.", tags:["stt","transcription"], url:"https://github.com/openai/whisper"},
  {name:"Codeium", cat:"code", price:"freemium", rating:4.5, featured:false, desc:"Free AI code completion and chat.", tags:["autocomplete","free"], url:"https://codeium.com"},
  {name:"Research Rabbit", cat:"research", price:"free", rating:4.0, featured:false, desc:"Visual discovery of academic papers (free).", tags:["discovery","papers"], url:"https://www.researchrabbit.ai"},
  {name:"Otter.ai", cat:"productivity", price:"freemium", rating:4.3, featured:false, desc:"Meeting transcription with a free plan.", tags:["meetings","transcript"], url:"https://otter.ai"},
  // ... (add more if you like)
];

/* ============== Categories & Colors ============== */
const CATEGORIES = [
  {id:"all",      label:"All"},
  {id:"writing",  label:"Writing"},
  {id:"image",    label:"Image"},
  {id:"video",    label:"Video"},
  {id:"audio",    label:"Audio"},
  {id:"code",     label:"Code"},
  {id:"chat",     label:"Chatbot"},
  {id:"research", label:"Research"},
  {id:"productivity", label:"Productivity"},
  {id:"other",    label:"Other"}
];

const ICON_COLORS = {
  writing:"#22d3ee", image:"#f472b6", video:"#7c5cff", audio:"#34d399",
  code:"#60a5fa", chat:"#fbbf24", research:"#f97316", productivity:"#a78bfa",
  other:"#7c5cff"
};

/* ============== State ============== */
let TOOLS = [];          // populated after fetch
let activeCategory = "all";
let query = "";
let sortMode = "default"; // "default", "rating", "name"

/* ============== Helpers ============== */
const $ = (s)=>document.querySelector(s);
const el = (tag, cls, html)=>{
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html!=null) e.innerHTML = html;
  return e;
};

function initials(name){
  if (!name) return "?";
  return name.replace(/[^A-Za-z0-9 ]/g,"").split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase();
}

function priceClass(p){
  return p === "free" ? "free" : (p === "paid" ? "paid" : "freemium");
}
function priceLabel(p){
  if (!p) return "Free";
  return p.charAt(0).toUpperCase() + p.slice(1);
}

/* ============== Data Loading ============== */
async function loadTools(){
  try {
    const res = await fetch(DATA_URL);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const raw = await res.json();

    // The hlist.cc API returns { tools: [...] }.
    // We keep only entries whose pricing_tier is "free" or "freemium".
    const all = raw.tools || [];
    const freeAndFreemium = all.filter(t => t.pricing_tier === 'free' || t.pricing_tier === 'freemium');

    TOOLS = freeAndFreemium.map((item, index) => {
      // Map hlist fields to the UI's expected shape.
      const name = item.title ? item.title.replace(/\s*Review.*/i, '').trim() : item.slug;
      const cat = item.category || "other";
      const price = item.pricing_tier || "free";
      const rating = 4.0 + Math.random() * 0.9; // placeholder rating
      const featured = index < 10;               // mark first 10 as featured
      const desc = item.description || "No description available.";
      const tags = [cat, price];                 // minimal tags
      const url = item.website || "#";

      return {
        name: name,
        cat: cat,
        price: price,
        rating: rating,
        featured: featured,
        desc: desc,
        tags: tags,
        url: url
      };
    });

    console.log(`Loaded ${TOOLS.length} free/freemium tools from hlist.cc.`);
  } catch (err) {
    console.warn("Remote fetch failed, using fallback sample.", err);
    TOOLS = FALLBACK_TOOLS;
  }
}

/* ============== Render: Grid ============== */
function renderGrid(){
  const grid = $("#grid");
  grid.innerHTML = "";

  // Filter by category
  let list = TOOLS.filter(t => activeCategory === "all" || t.cat === activeCategory);

  // Filter by search query
  const q = query.trim().toLowerCase();
  if (q) {
    list = list.filter(t =>
      t.name.toLowerCase().includes(q) ||
      t.desc.toLowerCase().includes(q) ||
      (t.tags || []).some(tag => tag.toLowerCase().includes(q))
    );
  }

  // Sort
  if (sortMode === "rating") {
    list.sort((a,b) => b.rating - a.rating);
  } else if (sortMode === "name") {
    list.sort((a,b) => a.name.localeCompare(b.name));
  }

  // Update result count
  const total = TOOLS.length;
  $("#resultCount").textContent = q
    ? `${list.length} of ${total} free tools found`
    : `${total} free tools`;

  // Empty state
  if (list.length === 0) {
    grid.appendChild(el("div","empty",
      '<div class="big">🔍</div>'+
      '<div style="font-weight:600;color:var(--text);margin-bottom:4px">No tools found</div>'+
      '<div>Try a different keyword or category.</div>'));
    return;
  }

  // Render cards
  list.forEach(t => {
    const color = ICON_COLORS[t.cat] || ICON_COLORS.other;
    const card = el("div","card");
    card.innerHTML = `
      <div class="card-head">
        <div class="icon" style="background:linear-gradient(135deg, ${color}, ${color}cc)">${initials(t.name)}</div>
        <div>
          <div class="card-title">${t.name}${t.featured ? ' <span style="font-size:10px;color:#0b0d12;background:'+color+';padding:2px 6px;border-radius:4px;vertical-align:middle;margin-left:6px;font-weight:700">Featured</span>' : ''}</div>
          <div class="card-cat">${CATEGORIES.find(c=>c.id===t.cat)?.label || t.cat}</div>
        </div>
      </div>
      <div class="card-desc">${t.desc}</div>
      <div class="card-tags">
        <span class="tag ${priceClass(t.price)}">${priceLabel(t.price)}</span>
        ${(t.tags||[]).slice(0,4).map(tag=>`<span class="tag">${tag}</span>`).join("")}
      </div>
      <div class="card-foot">
        <div class="rate"><span class="star">★</span> ${t.rating.toFixed(1)}</div>
        <a class="visit" href="${t.url}" target="_blank" rel="noopener noreferrer">Visit <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M7 17 17 7M9 7h8v8"/></svg></a>
      </div>
    `;
    grid.appendChild(card);
  });
}

/* ============== Events ============== */
$("#search").addEventListener("input", (e)=>{
  query = e.target.value;
  renderGrid();
});

// Category chips
document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    activeCategory = chip.dataset.cat;
    renderGrid();
  });
});

// Sort dropdown
$("#sort").addEventListener("change", (e) => {
  sortMode = e.target.value;
  renderGrid();
});

/* ============== Init ============== */
(async function init() {
  // Build category chips dynamically
  const filtersEl = document.querySelector('.filters');
  CATEGORIES.forEach(cat => {
    const chip = el('button', `chip${cat.id === 'all' ? ' active' : ''}`, cat.label);
    chip.dataset.cat = cat.id;
    chip.addEventListener('click', () => {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      activeCategory = cat.id;
      renderGrid();
    });
    filtersEl.appendChild(chip);
  });

  // Build sort dropdown
  const sortWrap = document.querySelector('.sort-wrap');
  sortWrap.innerHTML = `
    <label for="sort">Sort by</label>
    <select id="sort">
      <option value="default">Default</option>
      <option value="rating">Rating</option>
      <option value="name">Name</option>
    </select>
  `;
  document.getElementById('sort').addEventListener('change', (e) => {
    sortMode = e.target.value;
    renderGrid();
  });

  await loadTools();
  renderGrid();
})();
</script>
</body>
</html>
